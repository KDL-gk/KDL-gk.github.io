<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安防工勘表 - 系统设置</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; font-size: 14px; }

.header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
.header-left h1 { font-size: 20px; font-weight: 600; }
.header-left .sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 4px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.header-right .user-info { font-size: 13px; color: rgba(255,255,255,0.9); }
.btn-back { padding: 6px 14px; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; }
.btn-back:hover { background: rgba(255,255,255,0.3); }

.container { max-width: 1000px; margin: 0 auto; padding: 24px; }

.section { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.section-title { font-size: 17px; font-weight: 600; color: #1e3a8a; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

/* Stats */
.stats { display: flex; gap: 16px; margin-bottom: 20px; }
.stat-card { flex: 1; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; text-align: center; }
.stat-card .num { font-size: 28px; font-weight: 700; color: #2563eb; }
.stat-card .label { font-size: 13px; color: #6b7280; margin-top: 4px; }

/* User table */
.user-table { width: 100%; border-collapse: collapse; }
.user-table th, .user-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
.user-table th { background: #f8fafc; font-weight: 600; color: #374151; }
.user-table tr:hover { background: #f9fafb; }
.role-badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.role-admin { background: #dbeafe; color: #1d4ed8; }
.role-user { background: #f3f4f6; color: #6b7280; }
.role-select { padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; }
.role-select:focus { border-color: #2563eb; }
.btn-delete-user { padding: 4px 12px; background: #fff; color: #ef4444; border: 1px solid #fca5a5; border-radius: 6px; font-size: 12px; cursor: pointer; }
.btn-delete-user:hover { background: #fef2f2; }

/* Batch add */
.batch-area { margin-top: 16px; }
.batch-area textarea { width: 100%; min-height: 120px; border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; font-size: 13px; font-family: monospace; outline: none; resize: vertical; }
.batch-area textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.batch-hint { font-size: 12px; color: #9ca3af; margin-top: 6px; line-height: 1.6; }
.btn-row { display: flex; gap: 12px; margin-top: 12px; }
.btn { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary { background: #f3f4f6; color: #374151; }
.btn-secondary:hover { background: #e5e7eb; }

/* Single add */
.add-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f3f4f6; }
.add-form .form-group { display: flex; flex-direction: column; }
.add-form .form-group label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
.add-form .form-group input, .add-form .form-group select { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; }
.add-form .form-group input:focus { border-color: #2563eb; }

.msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
.msg.error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
.msg.success { display: block; background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }

@media (max-width: 768px) {
  .stats { flex-direction: column; }
  .add-form { flex-direction: column; }
}

.platform-desc { font-size: 13px; color: #6b7280; margin-bottom: 16px; line-height: 1.6; }
.storage-form { margin-top: 8px; }
.storage-current { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
.storage-current label { font-size: 12px; color: #6b7280; display: block; margin-bottom: 4px; }
.storage-value { font-size: 14px; color: #1e3a8a; font-weight: 500; word-break: break-all; }
.storage-edit-area { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
.storage-edit-area .form-group label { font-size: 12px; color: #6b7280; margin-bottom: 4px; display: block; }
.storage-history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
.storage-history-item .addr { color: #374151; flex: 1; word-break: break-all; }
.storage-history-item .time { color: #9ca3af; white-space: nowrap; margin-left: 12px; }
.storage-history-item .btn-use { padding: 2px 10px; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 8px; }
.storage-history-item .btn-use:hover { background: #dbeafe; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>⚙️ 系统设置</h1>
    <div class="sub">用户权限管理</div>
  </div>
  <div class="header-right">
    <a class="btn-back" href="projects.html">📋 返回项目列表</a>
    <span class="user-info">👤 <span id="currentUser"></span></span>
  </div>
</div>

<div class="container">
  <div id="msgBox" class="msg"></div>

  <div class="stats">
    <div class="stat-card"><div class="num" id="statAll">0</div><div class="label">总用户数</div></div>
    <div class="stat-card"><div class="num" id="statAdmin">0</div><div class="label">管理员</div></div>
    <div class="stat-card"><div class="num" id="statStaff">0</div><div class="label">实施人员</div></div>
  </div>

  <div class="section">
    <div class="section-title">👥 用户列表</div>
    <table class="user-table">
      <thead>
        <tr>
          <th style="width:40px">#</th>
          <th>用户名</th>
          <th>姓名</th>
          <th>角色</th>
          <th>权限设置</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">➕ 添加人员</div>
    <div class="add-form">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="addUsername" placeholder="登录用户名" style="width:140px">
      </div>
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="addName" placeholder="真实姓名" style="width:120px">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="text" id="addPassword" placeholder="初始密码" value="123456" style="width:120px">
      </div>
      <div class="form-group">
        <label>角色</label>
        <select id="addRole" style="width:120px">
          <option value="user">实施人员</option>
          <option value="admin">管理员</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="addSingleUser()">添加</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📋 批量添加实施人员</div>
    <div class="batch-area">
      <textarea id="batchInput" placeholder="每行一个用户，格式：用户名,姓名,密码&#10;例如：&#10;zhangsan,张三,123456&#10;lisi,李四,123456&#10;wangwu,王五,123456"></textarea>
      <div class="batch-hint">
        格式：用户名,姓名,密码（每行一个）<br>
        密码留空则默认为 123456，角色统一为"实施人员"
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="batchAddUsers()">批量添加</button>
        <button class="btn btn-secondary" onclick="document.getElementById('batchInput').value=''">清空</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🖥️ 平台设置</div>
    <div class="platform-desc">配置外挂存储服务器地址，用于项目数据和图片的远程存储。支持云端服务器、本地接外网服务器或 NAS 存储。</div>
    <div class="storage-form">
      <div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;">
        <div class="storage-current" style="flex:1;min-width:200px;margin-bottom:0;">
          <label>当前存储地址</label>
          <div class="storage-value" id="currentStorageDisplay">未配置（使用本地浏览器存储）</div>
        </div>
        <div class="storage-current" style="flex:1;min-width:200px;margin-bottom:0;">
          <label>存储容量</label>
          <div id="storageCapacityInfo" style="margin-top:4px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
              <span>已使用 <strong id="storageUsed">0 KB</strong></span>
              <span>总容量 <strong id="storageTotal">--</strong></span>
            </div>
            <div style="background:#e5e7eb;border-radius:6px;height:14px;overflow:hidden;">
              <div id="storageBar" style="height:100%;border-radius:6px;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width 0.5s;width:0%"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#9ca3af;margin-top:4px;">
              <span id="storagePercent">0%</span>
              <span>剩余 <span id="storageFree">--</span></span>
            </div>
          </div>
        </div>
      </div>
      <div class="storage-edit-area">
        <div class="form-group" style="flex:1">
          <label>存储类型</label>
          <select id="storageType" onchange="toggleStorageFields()" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
            <option value="local">本地浏览器存储（默认）</option>
            <option value="cloud">云端服务器</option>
            <option value="lan">本地服务器/NAS（接外网）</option>
          </select>
        </div>
        <div id="storageFields" style="display:none;margin-top:12px;">
          <div class="form-group" style="margin-bottom:12px;">
            <label>服务器地址</label>
            <input type="text" id="storageAddr" placeholder="如：https://your-server.com 或 http://192.168.1.100:8080" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
          </div>
          <div style="display:flex;gap:12px;">
            <div class="form-group" style="flex:1">
              <label>API路径（选填）</label>
              <input type="text" id="storageApiPath" placeholder="如：/api/storage" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
            </div>
            <div class="form-group" style="flex:1">
              <label>认证密钥（选填）</label>
              <input type="text" id="storageAuthKey" placeholder="如：Bearer xxxxxx" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
            </div>
          </div>
          <div class="form-group" style="margin-top:12px;">
            <label>备注说明</label>
            <input type="text" id="storageNote" placeholder="如：阿里云OSS / 公司NAS / Synology" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;">
          </div>
        </div>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn btn-primary" onclick="saveStorageConfig()">💾 保存配置</button>
          <button class="btn btn-secondary" onclick="testStorageConnection()">🔗 测试连接</button>
        </div>
      </div>
      <div id="storageHistory" style="margin-top:20px;display:none;">
        <div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;">📜 历史配置记录</div>
        <div id="storageHistoryList"></div>
      </div>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
// Auth guard - admin only
(function() {
  const token = localStorage.getItem('token');
  const user = localStorage.getItem('user');
  if (!token || !user) { window.location.href = 'index.html'; return; }
  try {
    const u = JSON.parse(user);
    if (u.role !== 'admin') { window.location.href = 'projects.html'; return; }
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('currentUser').textContent = u.name || u.username;
      renderUsers();
    });
  } catch(e) { window.location.href = 'index.html'; }
})();

function showMsg(text, type) {
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className = 'msg ' + type;
  setTimeout(() => el.className = 'msg', 4000);
}

async function renderUsers() {
  const users = await API.getUsers();
  const tbody = document.getElementById('userTableBody');
  const currentUser = JSON.parse(localStorage.getItem('user'));

  document.getElementById('statAll').textContent = users.length;
  document.getElementById('statAdmin').textContent = users.filter(u => u.role === 'admin').length;
  document.getElementById('statStaff').textContent = users.filter(u => u.role !== 'admin').length;

  tbody.innerHTML = users.map((u, i) => {
    const isSelf = u.username === currentUser.username;
    const roleBadge = u.role === 'admin'
      ? '<span class="role-badge role-admin">管理员</span>'
      : '<span class="role-badge role-user">实施人员</span>';
    const roleSelect = isSelf
      ? roleBadge
      : `<select class="role-select" onchange="changeRole('${u.username}', this.value)">
           <option value="admin" ${u.role==='admin'?'selected':''}>管理员</option>
           <option value="user" ${u.role!=='admin'?'selected':''}>实施人员</option>
         </select>`;
    const deleteBtn = isSelf
      ? '<span style="color:#ccc;font-size:12px">当前账号</span>'
      : `<button class="btn-delete-user" onclick="deleteUser('${u.username}')">删除</button>`;
    return `<tr>
      <td>${i+1}</td>
      <td><strong>${esc(u.username)}</strong></td>
      <td>${esc(u.name)}</td>
      <td>${roleBadge}</td>
      <td>${roleSelect}</td>
      <td>${deleteBtn}</td>
    </tr>`;
  }).join('');
}

async function changeRole(username, newRole) {
  try {
    await API.changeUserRole(username, newRole);
    renderUsers();
    showMsg(`已更改角色`, 'success');
  } catch(err) { showMsg(err.message, 'error'); }
}

async function deleteUser(username) {
  if (!confirm('确定删除该用户？')) return;
  try {
    await API.deleteUser(username);
    renderUsers();
    showMsg('用户已删除', 'success');
  } catch(err) { showMsg(err.message, 'error'); }
}

async function addSingleUser() {
  const username = document.getElementById('addUsername').value.trim();
  const name = document.getElementById('addName').value.trim();
  const password = document.getElementById('addPassword').value.trim();
  const role = document.getElementById('addRole').value;

  if (!username || !name) { showMsg('请填写用户名和姓名', 'error'); return; }
  if (username.length < 3) { showMsg('用户名至少3个字符', 'error'); return; }

  try {
    await API.addUser({ username, password: password || '123456', name, role });
    renderUsers();
    document.getElementById('addUsername').value = '';
    document.getElementById('addName').value = '';
    showMsg(`已添加用户：${name}`, 'success');
  } catch(err) { showMsg(err.message, 'error'); }
}

async function batchAddUsers() {
  const input = document.getElementById('batchInput').value.trim();
  if (!input) { showMsg('请输入要添加的用户信息', 'error'); return; }

  const lines = input.split('\n').map(l => l.trim()).filter(l => l);
  const batch = lines.map(line => {
    const parts = line.split(/[,，\t]/).map(s => s.trim());
    return { username: parts[0], name: parts[1] || parts[0], password: parts[2] || '123456' };
  });

  try {
    const res = await API.batchAddUsers(batch);
    renderUsers();
    document.getElementById('batchInput').value = '';
    showMsg(`批量添加完成：成功 ${res.added} 人`, res.added > 0 ? 'success' : 'error');
  } catch(err) { showMsg(err.message, 'error'); }
}

function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

// ===== Platform Storage Settings =====
const STORAGE_CONFIG_KEY = '_survey_storage_config';
const STORAGE_HISTORY_KEY = '_survey_storage_history';

function getStorageConfig() {
  try { return JSON.parse(localStorage.getItem(STORAGE_CONFIG_KEY)) || null; } catch(e) { return null; }
}
function saveStorageConfigData(config) { localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(config)); }
function getStorageHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_HISTORY_KEY)) || []; } catch(e) { return []; }
}
function addStorageHistory(config) {
  const history = getStorageHistory();
  history.unshift({ ...config, savedAt: new Date().toISOString() });
  if (history.length > 10) history.length = 10;
  localStorage.setItem(STORAGE_HISTORY_KEY, JSON.stringify(history));
}

function renderStorageConfig() {
  const config = getStorageConfig();
  const display = document.getElementById('currentStorageDisplay');
  if (config && config.type !== 'local') {
    const typeLabel = config.type === 'cloud' ? '☁️ 云端服务器' : '🖧 本地服务器/NAS';
    display.innerHTML = `${typeLabel}：<strong>${esc(config.addr)}</strong>${config.note ? ' (' + esc(config.note) + ')' : ''}`;
    document.getElementById('storageType').value = config.type;
    document.getElementById('storageAddr').value = config.addr || '';
    document.getElementById('storageApiPath').value = config.apiPath || '';
    document.getElementById('storageAuthKey').value = config.authKey || '';
    document.getElementById('storageNote').value = config.note || '';
    toggleStorageFields();
  } else {
    display.textContent = '未配置（使用本地浏览器存储）';
  }
  renderStorageHistory();
}

function toggleStorageFields() {
  const type = document.getElementById('storageType').value;
  document.getElementById('storageFields').style.display = type === 'local' ? 'none' : 'block';
}

function saveStorageConfig() {
  const type = document.getElementById('storageType').value;
  if (type === 'local') {
    localStorage.removeItem(STORAGE_CONFIG_KEY);
    showMsg('已切换为本地浏览器存储', 'success');
    renderStorageConfig();
    return;
  }
  const addr = document.getElementById('storageAddr').value.trim();
  if (!addr) { showMsg('请输入服务器地址', 'error'); return; }
  const config = {
    type,
    addr,
    apiPath: document.getElementById('storageApiPath').value.trim(),
    authKey: document.getElementById('storageAuthKey').value.trim(),
    note: document.getElementById('storageNote').value.trim(),
    updatedAt: new Date().toISOString()
  };
  saveStorageConfigData(config);
  addStorageHistory(config);
  showMsg('存储配置已保存：' + addr, 'success');
  renderStorageConfig();
  renderStorageCapacity();
}

function testStorageConnection() {
  const type = document.getElementById('storageType').value;
  if (type === 'local') { showMsg('本地存储无需测试连接', 'success'); return; }
  const addr = document.getElementById('storageAddr').value.trim();
  if (!addr) { showMsg('请先输入服务器地址', 'error'); return; }
  const apiPath = document.getElementById('storageApiPath').value.trim();
  const authKey = document.getElementById('storageAuthKey').value.trim();
  const url = addr.replace(/\/+$/, '') + (apiPath || '/ping');
  showMsg('正在测试连接 ' + addr + ' ...', 'success');
  const headers = {};
  if (authKey) headers['Authorization'] = authKey;
  fetch(url, { method: 'GET', headers, mode: 'cors', signal: AbortSignal.timeout(8000) })
    .then(res => {
      if (res.ok) showMsg('✅ 连接成功！服务器响应正常 (' + res.status + ')', 'success');
      else showMsg('⚠️ 服务器响应异常，状态码：' + res.status, 'error');
    })
    .catch(err => {
      showMsg('❌ 连接失败：' + (err.name === 'TimeoutError' ? '连接超时（8秒）' : err.message), 'error');
    });
}

function renderStorageHistory() {
  const history = getStorageHistory();
  const container = document.getElementById('storageHistory');
  const list = document.getElementById('storageHistoryList');
  if (!history.length) { container.style.display = 'none'; return; }
  container.style.display = 'block';
  list.innerHTML = history.map(h => {
    const d = new Date(h.savedAt);
    const dateStr = d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
    const typeIcon = h.type === 'cloud' ? '☁️' : '🖧';
    return `<div class="storage-history-item">
      <span class="addr">${typeIcon} ${esc(h.addr)}${h.note ? ' (' + esc(h.note) + ')' : ''}</span>
      <span class="time">${dateStr}</span>
      <button class="btn-use" onclick="applyHistoryConfig('${esc(h.addr)}','${esc(h.apiPath||'')}','${esc(h.authKey||'')}','${h.type}','${esc(h.note||'')}')">使用</button>
    </div>`;
  }).join('');
}

function applyHistoryConfig(addr, apiPath, authKey, type, note) {
  document.getElementById('storageType').value = type;
  document.getElementById('storageAddr').value = addr;
  document.getElementById('storageApiPath').value = apiPath;
  document.getElementById('storageAuthKey').value = authKey;
  document.getElementById('storageNote').value = note;
  toggleStorageFields();
  showMsg('已填入历史配置，点击"保存配置"生效', 'success');
}

document.addEventListener('DOMContentLoaded', () => { renderStorageConfig(); renderStorageCapacity(); });

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(2) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}

function renderStorageCapacity() {
  const config = getStorageConfig();
  if (config && config.type !== 'local') {
    renderRemoteStorageCapacity(config);
  } else {
    renderLocalStorageCapacity();
  }
}

function renderLocalStorageCapacity() {
  let totalSize = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    totalSize += (key.length + localStorage.getItem(key).length) * 2;
  }
  const estimatedMax = 5 * 1024 * 1024;
  const pct = Math.min((totalSize / estimatedMax) * 100, 100);
  document.getElementById('storageUsed').textContent = formatBytes(totalSize);
  document.getElementById('storageTotal').textContent = '5 MB（浏览器限制）';
  document.getElementById('storageFree').textContent = formatBytes(Math.max(estimatedMax - totalSize, 0));
  document.getElementById('storageBar').style.width = pct.toFixed(1) + '%';
  document.getElementById('storageBar').style.background = pct > 80 ? 'linear-gradient(90deg,#f59e0b,#ef4444)' : 'linear-gradient(90deg,#2563eb,#7c3aed)';
  document.getElementById('storagePercent').textContent = pct.toFixed(1) + '%';
}

function renderRemoteStorageCapacity(config) {
  const addr = config.addr.replace(/\/+$/, '');
  const apiPath = config.apiPath || '/api/storage';
  const url = addr + apiPath + '/capacity';
  const headers = {};
  if (config.authKey) headers['Authorization'] = config.authKey;
  document.getElementById('storageUsed').textContent = '查询中...';
  document.getElementById('storageTotal').textContent = '--';
  document.getElementById('storageFree').textContent = '--';
  fetch(url, { headers, mode: 'cors', signal: AbortSignal.timeout(8000) })
    .then(r => r.json())
    .then(data => {
      const used = data.used || 0;
      const total = data.total || 0;
      const free = total - used;
      const pct = total > 0 ? (used / total) * 100 : 0;
      document.getElementById('storageUsed').textContent = formatBytes(used);
      document.getElementById('storageTotal').textContent = formatBytes(total);
      document.getElementById('storageFree').textContent = formatBytes(Math.max(free, 0));
      document.getElementById('storageBar').style.width = pct.toFixed(1) + '%';
      document.getElementById('storageBar').style.background = pct > 80 ? 'linear-gradient(90deg,#f59e0b,#ef4444)' : 'linear-gradient(90deg,#2563eb,#7c3aed)';
      document.getElementById('storagePercent').textContent = pct.toFixed(1) + '%';
    })
    .catch(() => {
      renderLocalStorageCapacity();
      document.getElementById('storageTotal').textContent = '5 MB（远程查询失败，显示本地）';
    });
}
</script>

</html>
