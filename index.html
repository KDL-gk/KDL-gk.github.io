<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安防工勘表 - 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }

.login-container { width: 420px; }
.login-card { background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.login-header { text-align: center; margin-bottom: 32px; }
.login-header .logo { font-size: 48px; margin-bottom: 12px; }
.login-header h1 { font-size: 22px; color: #1e3a8a; }
.login-header p { font-size: 13px; color: #6b7280; margin-top: 6px; }

.btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
.btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
.msg.error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
.msg.success { display: block; background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; font-weight: 500; }
.form-group input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; transition: all 0.2s; }
.form-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

.footer-text { text-align: center; margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.7); }

.user-mgmt-link { text-align: center; margin-top: 16px; }
.user-mgmt-link a { color: #2563eb; font-size: 13px; cursor: pointer; text-decoration: none; }
.user-mgmt-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🏫</div>
      <h1>安防工勘表系统</h1>
      <p>学校安防勘测管理平台</p>
    </div>

    <div id="msgBox" class="msg"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="loginUser" placeholder="请输入用户名" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPass" placeholder="请输入密码" required>
      </div>
      <button type="submit" class="btn-submit" id="loginBtn">登 录</button>
    </form>
  </div>
  <div class="footer-text">安防工勘表管理系统 v2.0</div>
</div>

<script src="api.js"></script>
<script>
function showMsg(text, type) {
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className = 'msg ' + type;
}
function hideMsg() { document.getElementById('msgBox').className = 'msg'; }

async function handleLogin(e) {
  e.preventDefault();
  hideMsg();
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) { showMsg('请输入用户名和密码', 'error'); return; }
  try {
    await API.login(username, password);
    showMsg('登录成功，正在跳转...', 'success');
    setTimeout(() => window.location.href = 'projects.html', 600);
  } catch(err) { showMsg(err.message, 'error'); }
}

if (localStorage.getItem('token')) { window.location.href = 'projects.html'; }
</script>
</body>
</html>
